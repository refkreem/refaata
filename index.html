function addMonths(iso,m){if(!iso)return'';var p=iso.split('-').map(Number);var d=new Date(p[0],p[1]-1+m,1);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(p[2],last));return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function daysTo(iso){if(!iso)return null;var p=iso.split('-').map(Number);var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(p[0],p[1]-1,p[2])-t)/864e5)}
function initialDate(p){return p.start&&p.months?addMonths(p.start,num(p.months)):''}
function finalDate(p){var i=initialDate(p);return i?addMonths(i,12):''}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},3200)}
function by(a,f){return a.slice().sort(function(x,y){var u=f(x),v=f(y);return u<v?-1:u>v?1:0})}
function sum(a,f){var s=0;for(var i=0;i<a.length;i++)s+=num(f?f(a[i]):a[i]);return s}
function cls(n){return n>0.004?'good':n<-0.004?'bad':''}

var db={collection:function(n){var flt=null;var api={where:function(f,op,v){flt=[f,v];return api},get:function(){var c=ld()[n]||{};var ids=Object.keys(c).filter(function(id){return!flt||c[id][flt[0]]===flt[1]});return Promise.resolve({docs:ids.map(function(id){return{id:id,data:function(){return c[id]}}})})},doc:function(id){return{set:function(o){var d=ld();d[n]=d[n]||{};d[n][id]=JSON.parse(JSON.stringify(o));sv(d);return Promise.resolve()},delete:function(){var d=ld();if(d[n])delete d[n][id];sv(d);return Promise.resolve()},get:function(){var c=ld()[n]||{};return Promise.resolve({exists:!!c[id],data:function(){return c[id]}})}}}};return api},doc:function(p){var a=p.split('/');return db.collection(a[0]).doc(a[1])}};return db}

async function migrateLegacy(){var counts={},had=0;
 try{var lc=await S.db.doc('meta/config_v4').get();if(lc.exists){var ex=await S.db.doc(CFGDOC).get();if(!ex.exists){var d=Object.assign(defaultCfg(),lc.data());delete d.ns;S.cfg=Object.assign(S.cfg,d);counts.config=1}}}catch(e){console.error('mig cfg',e)}
 for(var k of Object.keys(LEGACY)){counts[k]=0;try{var old=await qNs(LEGACY[k]);var cur={};(await qNs(COL[k])).docs.forEach(function(d){cur[d.id]=1});
  for(var d of old.docs){if(cur[d.id])continue;var v=d.data();v.id=d.id;await S.db.collection(COL[k]).doc(d.id).set(clean(v));counts[k]++;had++}}catch(e){console.error('mig '+k,e);counts[k]='خطأ'}}
 S.cfg.migrated_v4={at:new Date().toISOString(),counts:counts};await saveCfg();return counts}

 S.role=roleOf(S.user);
 if(!S.cfg.migrated_v4&&isFin()&&!S.loadErr){try{var m=await migrateLegacy();S.role=roleOf(S.user);var n=sum(Object.keys(m),function(k){return typeof m[k]==='number'?m[k]:0});if(n)toast('تم نقل '+n+' سجل إلى المجموعات المعزولة لنسخة Claude')}catch(e){console.error('migrate',e)}}

/* ---------- calc engine ---------- */
function apr(t){return t.status!=='pending'&&t.status!=='rejected'}
function TX(){return S.txs.filter(apr)}
function proj(id){return S.projects.filter(function(p){return p.id===id})[0]}
function acc(id){return S.accounts.filter(function(a){return a.id===id})[0]}
function pname(id){var p=proj(id);return p?p.name:(id?'(مشروع محذوف)':'عام / غير موزع')}
function aname(id){var a=acc(id);return a?a.name:'—'}
function cname(id){var c=S.cfg.contractors.filter(function(x){return x.id===id})[0];return c?c.name:'—'}
function boqItem(pid,bid){var p=proj(pid);if(!p)return null;return p.boq.filter(function(b){return b.id===bid})[0]||null}
function boqLabel(b){return(b.code?b.code+' - ':'')+b.name}
function lineVal(l){return num(l.qty)*num(l.price)}
function costOf(t){switch(t.type){case'purchase':return num(t.total);case'sub':return num(t.gross)-num(t.prior_paid);case'labor':return num(t.total);case'expense':return t.project_id?num(t.amount):0}return 0}
function cashMoves(t){var m=[];function o(a,v){if(num(v)&&a)m.push({acc:a,amt:-num(v)})}
 switch(t.type){case'purchase':o(t.account_id,t.paid);break;case'sub':o(t.account_id,t.paid);break;case'labor':o(t.account_id,t.net);break;case'expense':case'adv':case'payment':o(t.account_id,t.amount);break;
 case'revenue':if(t.account_id&&num(t.amount))m.push({acc:t.account_id,amt:num(t.amount)});break;
 case'transfer':o(t.from,t.amount);if(t.to&&num(t.amount))m.push({acc:t.to,amt:num(t.amount)});break}
 return m}
function accStats(a){var inn=0,out=0,n=0;TX().forEach(function(t){cashMoves(t).forEach(function(m){if(m.acc===a.id){n++;if(m.amt>0)inn+=m.amt;else out-=m.amt}})});return{opening:num(a.opening),inn:inn,out:out,n:n,bal:num(a.opening)+inn-out}}
function projTotals(pid){var r={purchase:0,sub:0,labor:0,expense:0,cost:0,revenue:0};TX().forEach(function(t){if(t.project_id!==pid)return;var c=costOf(t);if(r[t.type]!=null&&t.type!=='revenue')r[t.type]+=c;r.cost+=c;if(t.type==='revenue')r.revenue+=num(t.amount)});return r}
function itemUse(pid,bid,excl){var r={purchase:0,sub:0,labor:0,expense:0,pqty:{},subQty:0,progQty:0,total:0};TX().forEach(function(t){if(t.project_id!==pid||t.id===excl)return;
 if(t.type==='purchase')(t.lines||[]).forEach(function(l){if(l.boq_id===bid){r.purchase+=lineVal(l);var u=l.unit||'';r.pqty[u]=(r.pqty[u]||0)+num(l.qty)}});
 else if(t.type==='sub')(t.lines||[]).forEach(function(l){if(l.boq_id===bid){var q=num(l.qty)-num(l.qty_prev);r.sub+=q*num(l.price);r.subQty+=q}});
 else if(t.type==='labor'){if(t.rows&&t.rows.length)t.rows.forEach(function(w){if((w.boq_id||t.boq_id)===bid)r.labor+=num(w.total)});else if(t.boq_id===bid)r.labor+=num(t.total)}
 else if(t.type==='expense'){if(t.boq_id===bid&&t.project_id)r.expense+=num(t.amount)}
 else if(t.type==='progress'){if(t.boq_id===bid)r.progQty+=num(t.qty)}});
 r.total=r.purchase+r.sub+r.labor+r.expense;return r}
function itemizedCost(pid){var s=0;var p=proj(pid);if(!p)return 0;p.boq.forEach(function(b){s+=itemUse(pid,b.id).total});return s}
function boqValue(b){return num(b.qty)*num(b.price)}
function boqBudget(b){return num(b.qty)*(num(b.cost_price)||num(b.price))}
function projBoqValue(p){return sum(p.boq,boqValue)}
function prevQty(pid,party,bid,excl,date){var best=null;S.txs.forEach(function(t){if(t.type!=='sub'||t.project_id!==pid||t.party_id!==party||t.id===excl||t.status==='rejected')return;if(date&&t.date>date)return;(t.lines||[]).forEach(function(l){if(l.boq_id===bid){if(!best||t.date>best.d||(t.date===best.d&&(t.at||'')>best.a))best={d:t.date,a:t.at||'',q:num(l.qty)}}})});return best?best.q:0}
function lastPrice(pid,party,bid){var best=null;S.txs.forEach(function(t){if(t.type!=='sub'||t.project_id!==pid||t.party_id!==party)return;(t.lines||[]).forEach(function(l){if(l.boq_id===bid&&num(l.price)&&(!best||t.date>=best.d))best={d:t.date,p:num(l.price)}})});return best?best.p:0}
function contractorLedger(id,pid){var r={extracts:0,work:0,net:0,paid:0,payments:0,adv:0,recov:0,owed:0,advOut:0};TX().forEach(function(t){if(pid&&t.project_id&&t.project_id!==pid)return;
 if(t.type==='sub'&&t.party_id===id){r.extracts++;r.work+=costOf(t);r.net+=num(t.net);r.paid+=num(t.paid);r.recov+=num(t.adv_recov)}
 else if(t.type==='payment'&&t.kind==='contractor'&&t.party_id===id)r.payments+=num(t.amount);
 else if(t.type==='adv'&&t.kind==='contractor'&&t.party_id===id)r.adv+=num(t.amount)});
 var cc=S.cfg.contractors.filter(function(x){return x.id===id})[0];r.open=(!pid&&cc)?num(cc.open):0;r.owed=r.open+r.net-r.paid-r.payments;r.advOut=r.adv-r.recov;return r}
function supplierLedger(name,excl){var r={total:0,paid:0,payments:0,bal:0};TX().forEach(function(t){if(excl&&t.id===excl)return;if(t.type==='purchase'&&String(t.supplier||'').trim()===String(name||'').trim()){r.total+=num(t.total);r.paid+=num(t.paid)}else if(t.type==='payment'&&t.kind==='supplier'&&String(t.party||'').trim()===String(name||'').trim())r.payments+=num(t.amount)});r.open=(typeof supInfo==='function')?num(supInfo(name).open):0;r.bal=r.open+r.total-r.paid-r.payments;return r}
function workerAdv(name){var a=0,rc=0;TX().forEach(function(t){if(t.type==='adv'&&t.kind==='worker'&&t.party===name)a+=num(t.amount);if(t.type==='labor')(t.rows||[]).forEach(function(w){if(w.name===name)rc+=num(w.adv)})});return a-rc}
function itemState(pid,bid){var b=boqItem(pid,bid);if(!b)return null;var u=itemUse(pid,bid);return{b:b,u:u,val:boqValue(b),bud:boqBudget(b),rest:boqBudget(b)-u.total}}
function costTxIds(){return TX().filter(function(t){return costOf(t)!==0})}
function ensureReg(t){var c=S.cfg,ch=false;function add(arr,n){if(n&&arr.indexOf(n)<0){arr.push(n);ch=true}}
 add(c.suppliers,t.supplier&&t.type==='purchase'?t.supplier:'');
 if(t.type==='labor')(t.rows||[]).forEach(function(w){if(w.name&&!c.workers.some(function(x){return x.name===w.name})){c.workers.push({name:w.name,mode:w.mode,rate:num(w.rate)});ch=true}});
 if(t.type==='purchase')(t.lines||[]).forEach(function(l){if(!l.item)return;var f=c.catalog.filter(function(x){return x.name===l.item&&x.cat===t.cat})[0];if(!f){c.catalog.push({name:l.item,unit:l.unit,price:num(l.price),cat:t.cat});ch=true}else if(num(l.price)&&f.price!==num(l.price)){f.price=num(l.price);ch=true}});
 return ch}

function grp(v){var s=String(v==null?'':v).replace(/[٠-٩]/g,function(d){return'٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[,٬\s]/g,'').replace('٫','.');var neg=s.charAt(0)==='-';s=s.replace(/[^0-9.]/g,'');var i=s.indexOf('.');var ip=i<0?s:s.slice(0,i),fp=i<0?'':'.'+s.slice(i+1).replace(/\./g,'');ip=ip.replace(/^0+(?=\d)/,'');return(neg?'-':'')+ip.replace(/\B(?=(\d{3})+(?!\d))/g,',')+fp}
(function(){var d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');Object.defineProperty(HTMLInputElement.prototype,'value',{configurable:true,enumerable:d.enumerable,get:d.get,set:function(v){if(this.dataset&&this.dataset.n)v=grp(v);d.set.call(this,v)}})})();

try{new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType!==1)return;if(n.matches&&n.matches('input[type=number]'))numify(n.parentNode);else if(n.querySelector&&n.querySelector('input[type=number]'))numify(n)})})}).observe(document.documentElement,{childList:true,subtree:true})}catch(x){}

SECT.users=function(){var r=S.cfg.roles||{};var keys=Object.keys(r);return'<h3>المستخدمون والصلاحيات</h3><div class="hint" style="margin-bottom:10px">1) أنشئ المستخدم أولًا من Firebase Console ← Authentication ← Users ← Add user.<br>2) أضف بريده هنا مع دوره. <b>مدير النظام</b>: كل شيء. <b>محاسب</b>: كل شيء عدا الإعدادات ويعتمد الحركات. <b>مهندس موقع</b>: يدخل مشتريات/عمالة/مقاولين/مصروفات/إنجاز وتنتظر اعتماد المحاسب ولا يرى الأرصدة ولا الإيرادات. <b>إشراف فني</b>: المشاريع والمقايسة والإنجاز والتقارير الفنية.<br>'+(keys.length?'':'<b>تنبيه:</b> قبل إضافة أول مستخدم لا توجد صلاحيات فيدخل الجميع كمدير. عند الإضافة سيُضاف بريدك الحالي كمدير تلقائيًا.')+'</div>'+tbl([{h:'البريد'},{h:'الدور'},{h:''}],keys.map(function(k){return['<span dir="ltr">'+h(k)+'</span>',ROLE_NAMES[r[k]]||r[k],'<button class="btn sm d" data-a="roleDel" data-p="'+h(k)+'">إزالة</button>']}),{empty:'لا توجد صلاحيات مُعرَّفة (الكل مدير حاليًا)'})+'<div class="flt" style="margin-top:12px"><label>البريد<input id="r_em" type="email" dir="ltr"></label><label>الدور<select id="r_ro">'+opts(Object.keys(ROLE_NAMES),'engineer',null,function(k){return ROLE_NAMES[k]})+'</select></label><button class="btn p" data-a="roleAdd">+ إضافة</button></div>'};
ACT.roleAdd=async function(){var e=v$('r_em').trim().toLowerCase();if(!e)return;S.cfg.roles=S.cfg.roles||{};if(!Object.keys(S.cfg.roles).length&&S.user)S.cfg.roles[S.user]='admin';S.cfg.roles[e]=v$('r_ro');if(await saveCfg())render()};
ACT.roleDel=async function(k){if(k===S.user&&!confirm('ستزيل صلاحية حسابك الحالي. متابعة؟'))return;delete S.cfg.roles[k];if(await saveCfg())render()};
SECT.data=function(){return'<h3>نسخة احتياطية</h3><div class="flt"><button class="btn" data-a="backup">⬇ تحميل نسخة احتياطية (JSON)</button><label class="btn">⬆ استيراد نسخة احتياطية<input type="file" id="bk_file" accept=".json" style="display:none" data-a="noop"></label></div><div class="hint" style="margin-top:8px">الاستيراد يضيف/يحدّث السجلات بنفس أرقامها ولا يحذف شيئًا. يُستخدم عند الانتقال إلى مشروع Firebase جديد.</div>'+(isAdmin()?'<h3 style="margin-top:20px;color:var(--bad)">تصفير شامل (بدء من جديد)</h3><div class="hint" style="margin-bottom:10px">يحذف نهائيًا كل الحسابات والمشاريع والحركات وقوائم الإعدادات (المقاولون والموردون والعمال والأصناف) من نسخة مقاول Pro فقط. يُنزَّل ملف نسخة احتياطية تلقائيًا قبل الحذف. تبقى المستخدمون والصلاحيات.</div><button class="btn d" data-a="wipeAll">تصفير كل البيانات</button>':'')};
ACT.wipeAll=async function(){if(!isAdmin()){toast('للمدير فقط');return}var n=S.projects.length+S.txs.length+S.accounts.length;if(!confirm('سيتم حذف '+S.accounts.length+' حساب و'+S.projects.length+' مشروع و'+S.txs.length+' حركة نهائيًا، وسيُنزَّل ملف نسخة احتياطية أولًا. متابعة؟'))return;ACT.backup();var w=prompt('للتأكيد النهائي اكتب كلمة: تصفير');if((w||'').trim()!=='تصفير'){toast('لم يتم التصفير');return}toast('جارٍ الحذف...');for(var t of S.txs.slice())await dbDel('txs',t.id);for(var p of S.projects.slice())await dbDel('projects',p.id);for(var a of S.accounts.slice())await dbDel('accounts',a.id);var roles=S.cfg.roles||{};S.cfg=defaultCfg();S.cfg.roles=roles;S.cfg.migrated_v4=true;S.cfg.pcats_v5=true;await saveCfg();S.txs=[];S.projects=[];S.accounts=[];S.vp=null;render();toast('تم التصفير — النظام الآن فارغ ('+n+' سجل محذوف)')};
document.addEventListener('change',function(ev){if(ev.target.id!=='bk_file')return;var f=ev.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=async function(){try{var d=JSON.parse(rd.result)}catch(e){toast('ملف غير صالح');return}if(!d.projects||!d.txs){toast('ليس ملف نسخة احتياطية');return}if(!confirm('استيراد '+d.projects.length+' مشروع و'+d.txs.length+' حركة و'+(d.accounts||[]).length+' حساب؟'))return;if(d.cfg){S.cfg=Object.assign(defaultCfg(),d.cfg);delete S.cfg.ns;await saveCfg()}for(var a of d.accounts||[])await dbSet('accounts',a);for(var p of d.projects)await dbSet('projects',p);for(var t of d.txs)await dbSet('txs',t);await loadAll();render();toast('تم الاستيراد')};rd.readAsText(f)});
ACT.backup=function(){var d={at:new Date().toISOString(),cfg:S.cfg,accounts:S.accounts,projects:S.projects,txs:S.txs};var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='moqawel-backup-'+today()+'.json';a.click()};



/* ---------- الموردون بتخصصاتهم ---------- */
function supInfo(n){S.cfg.supInfo=S.cfg.supInfo||{};return S.cfg.supInfo[n]||{}}
SECT.suppliers=function(){return'<h3>الموردون</h3><div class="hint" style="margin-bottom:10px">تُضاف أسماء الموردين تلقائيًا عند تسجيل فاتورة، ويمكنك هنا تحديد تخصص كل مورد وهاتفه.</div><div class="flt"><button class="btn p" data-a="supAdd">+ مورد جديد</button></div>'+tbl([{h:'المورد'},{h:'التخصص'},{h:'الهاتف'},{h:'المتبقي له',n:1},{h:''}],S.cfg.suppliers.map(function(n,i){var f=supInfo(n);return[h(n),h(f.trade||''),h(f.phone||''),isFin()?fmt(supplierLedger(n).bal):'','<button class="btn sm" data-a="supEdit" data-p="'+i+'">تعديل</button> <button class="btn sm d" data-a="supDel" data-p="'+i+'">حذف</button>']}),{empty:'لا يوجد موردون بعد'})};
ACT.supAdd=function(){supForm(-1)};ACT.supEdit=function(i){supForm(+i)};
function supForm(i){var n0=i>=0?S.cfg.suppliers[i]:'',f=supInfo(n0);modal(i>=0?'تعديل مورد':'مورد جديد','<div class="fg">'+fld('اسم المورد',inp('sp_n',n0,'text',i>=0?'readonly':''),'full')+fld('التخصص (نوع التوريد)',inp('sp_t',f.trade||'','text','list="dl_sptr" placeholder="كهرباء / صحية / تكييف / دهانات…"'))+dlist('dl_sptr',S.cfg.pcats)+fld('الهاتف',inp('sp_p',f.phone||'','tel'))+fld('رصيد افتتاحي مستحق له (قبل بدء النظام)',inp('sp_o',f.open||'','number','step="any"'))+'</div>',{save:async function(){var n=v$('sp_n').trim();if(!n){toast('اكتب اسم المورد');return false}if(i<0&&S.cfg.suppliers.indexOf(n)>=0){toast('المورد موجود بالفعل');return false}if(i<0)S.cfg.suppliers.push(n);S.cfg.supInfo=S.cfg.supInfo||{};S.cfg.supInfo[n]={trade:v$('sp_t').trim(),phone:v$('sp_p').trim(),open:num(v$('sp_o'))};if(!await saveCfg())return false;render()}})}
ACT.supDel=async function(i){var n=S.cfg.suppliers[i];var k=S.txs.filter(function(t){return(t.type==='purchase'&&t.supplier===n)||(t.type==='payment'&&t.kind==='supplier'&&t.party===n)}).length;if(k){toast('لا يمكن حذف مورد عليه '+k+' حركة');return}if(!confirm('حذف المورد "'+n+'"؟'))return;S.cfg.suppliers.splice(+i,1);if(S.cfg.supInfo)delete S.cfg.supInfo[n];await saveCfg();render()};

ACT.go=function(v){go(v)};ACT.menu=function(){$('side').classList.toggle('open')};ACT.mclose=closeModal;
ACT.msave=async function(){if(!S.modalSave)return;var b=$('msaveBtn');b.disabled=true;try{var ok=await S.modalSave();if(ok!==false)closeModal()}catch(e){console.error(e);toast('حدث خطأ: '+e.message)}b.disabled=false};
ACT.refresh=async function(){if(!S.db)return;toast('جاري التحديث…');await loadAll();render();toast('تم التحديث')};
ACT.logout=function(){if(window.firebase&&firebase.auth)firebase.auth().signOut()};
document.addEventListener('click',function(ev){var el=ev.target.closest('[data-a]');if(!el)return;if(el.tagName==='SELECT'||el.tagName==='INPUT')return;var f=ACT[el.dataset.a];if(f){ev.preventDefault();f(el.dataset.p,el)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
function loginMsg(c){return{'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة','auth/wrong-password':'البريد أو كلمة المرور غير صحيحة','auth/user-not-found':'البريد أو كلمة المرور غير صحيحة','auth/invalid-email':'صيغة البريد غير صحيحة','auth/too-many-requests':'محاولات كثيرة، انتظر قليلًا','auth/network-request-failed':'لا يوجد اتصال بالإنترنت','auth/operation-not-allowed':'تسجيل الدخول بالبريد غير مفعّل'}[c]||('تعذر تسجيل الدخول ('+c+')')}
async function start(db,label,email){S.db=db;S.user=(email||'').toLowerCase();$('dot').classList.add('on');$('conn').textContent=label;$('main').innerHTML='<div class="card empty">جارٍ تحميل البيانات…</div>';await loadAll();render()}
async function boot(){
 if(window.firebase&&FIREBASE_CONFIG.apiKey){try{firebase.initializeApp(FIREBASE_CONFIG);var au=firebase.auth();
  $('loginForm').addEventListener('submit',function(e){e.preventDefault();$('lErr').textContent='';$('lBtn').disabled=true;au.signInWithEmailAndPassword($('lEmail').value.trim(),$('lPass').value).catch(function(er){$('lErr').textContent=loginMsg(er.code||'')}).then(function(){$('lBtn').disabled=false})});
  $('conn').textContent='بانتظار تسجيل الدخول…';
  au.onAuthStateChanged(function(u){if(u){$('login').classList.remove('show');$('logout').style.display='';$('lPass').value='';start(firebase.firestore(),'متصل — '+u.email,u.email)}else{S.db=null;$('dot').classList.remove('on');$('conn').textContent='غير مسجّل';$('logout').style.display='none';$('login').classList.add('show');$('main').innerHTML='';$('side').innerHTML=''}});return}catch(e){console.error('firebase',e)}}
 var te='';try{te=localStorage.getItem('moqawel_test_email')||''}catch(e){}
 await start(makeLocalDb(),'تخزين محلي على هذا الجهاز (بدون اتصال بالسحابة)',te);
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.db&&!$('modal').classList.contains('show')&&Date.now()-(S.lastLoad||0)>120000){S.lastLoad=Date.now();loadAll().then(render)}});
var BUILD='20261027-2353';
(function(){var v=document.getElementById('ver');if(v)v.textContent='v '+BUILD})();
async function checkUpdate(manual){try{if(!/^https?:/.test(location.protocol))return;var r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;var m=(await r.text()).match(/var BUILD='([^']+)'/);if(!m||m[1]===BUILD){if(manual)toast('أنت على آخر إصدار ('+BUILD+')');return}var k='upd_'+m[1],did=null;try{did=sessionStorage.getItem(k)}catch(e){}
 if(did&&!manual){toast('يوجد إصدار أحدث ('+m[1]+') — أغلق الصفحة وافتحها من جديد');return}
 if($('modal').classList.contains('show')){toast('يوجد إصدار جديد — سيُحمَّل بعد إغلاق النافذة');setTimeout(function(){checkUpdate()},15000);return}
 try{sessionStorage.setItem(k,'1')}catch(e){}toast('تحديث إلى الإصدار الجديد…');setTimeout(function(){location.reload()},700)}catch(e){}}
ACT.upd=function(){checkUpdate(true)};
document.addEventListener('visibilitychange',function(){if(!document.hidden)checkUpdate()});
setTimeout(checkUpdate,2500);setInterval(checkUpdate,600000);
boot();
